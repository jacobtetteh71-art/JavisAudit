name: javisaudit
description: A lightweight offline-first mobile digital ledger for VAT compliance among MSEs in Ghana.

# The publish_to: 'none' prevents accidental publishing to pub.dev
publish_to: 'none'

# Version of the app — major.minor.patch+buildNumber
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Database ────────────────────────────────────────────────────────────────
  # sqflite_sqlcipher: SQLite plugin, API-compatible fork of sqflite
  # that adds at-rest encryption (SQLCipher) — used INSTEAD OF plain
  # sqflite (never both: they register the same native plugin
  # channel and would conflict). The database file holding every
  # income, expense, sales, and profile record is now encrypted on
  # disk, not just gated by the app's PIN screen. Version constraint
  # kept below whatever requires Flutter 3.35+ (per its changelog),
  # since this project's CI is intentionally pinned to Flutter 3.32.1.
  sqflite_sqlcipher: '>=2.0.0 <4.0.0'

  # flutter_secure_storage: stores the random database encryption key
  # in the Android Keystore (hardware-backed on most devices) rather
  # than anywhere the app's own SQLite/Hive storage could read it.
  flutter_secure_storage: '>=9.0.0 <11.0.0'

  # path: helps build the correct file path to the database on different OS
  path: ^1.9.0

  # hive + hive_flutter: fast key-value store used for settings and notification flags
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── State Management ────────────────────────────────────────────────────────
  # provider: the ChangeNotifier pattern — keeps UI in sync with database changes
  provider: ^6.1.2

  # ── Charts ──────────────────────────────────────────────────────────────────
  # fl_chart: draws bar charts and pie charts in the dashboard and reports screens
  fl_chart: ^0.67.0

  # ── PDF Generation ──────────────────────────────────────────────────────────
  # pdf: generates the year-end audit PDF from Dart data
  pdf: ^3.11.0

  # printing: allows the user to share/print the generated PDF via Android share sheet
  printing: ^5.13.0

  # ── Notifications ───────────────────────────────────────────────────────────
  # flutter_local_notifications: fires local push alerts when VAT threshold is crossed
  flutter_local_notifications: ^17.2.2

  # ── File Handling ───────────────────────────────────────────────────────────
  # file_picker: opens a system file picker dialog for selecting backup JSON files
  file_picker: ^8.0.7

  # path_provider: gives us the Documents/Downloads directory path for saving files
  path_provider: ^2.1.3

  # share_plus: opens the Android share sheet so users can share PDF/backup via WhatsApp, email, etc.
  # PINNED to ^12.0.2: now that firebase_auth is a dependency (it pulls in
  # firebase_auth_web, which needs package:web ^1.0.0), share_plus versions
  # below 10.1 can no longer be used — they depend on package:web ^0.5.0,
  # which conflicts. 12.x is the version pub's own solver requires here.
  # This in turn means the native Android side needs AGP >=8.12.1 and
  # Gradle >=8.13 — both are set in android/build.gradle,
  # android/settings.gradle, and android/gradle/wrapper/gradle-wrapper.properties.
  share_plus: ^12.0.2

  # ── Utilities ───────────────────────────────────────────────────────────────
  # intl: formats dates (e.g., "15 Jun 2026") and numbers (e.g., "GH₵ 1,250.00")
  intl: ^0.19.0

  # uuid: generates unique IDs — used as idempotency keys in some operations
  uuid: ^4.4.0

  # crypto: used to securely hash the login PIN and backup password
  # (we never store the actual PIN/password — only a salted hash of it)
  crypto: ^3.0.3

  # image_picker: lets the user pick a profile picture from the
  # device camera or photo gallery
  image_picker: ^1.1.2

  # cupertino_icons: provides the default iOS-style icons (used by Flutter)
  cupertino_icons: ^1.0.8

  # ── Online / Cloud Sync ──────────────────────────────────────────────────
  # firebase_core: boots the connection to our Firebase project — every
  # other Firebase plugin needs this initialised first (see main.dart)
  firebase_core: ^3.6.0

  # firebase_auth: lets a business owner sign in with email + password so
  # their data can be tied to THEM (not just one phone) and pulled down
  # again on a new/replacement device
  firebase_auth: ^5.3.1

  # cloud_firestore: the actual cloud database we sync the local SQLite
  # data to/from — see lib/services/sync_service.dart
  cloud_firestore: ^5.4.4

  # google_sign_in: lets a business owner create/sign into their Cloud
  # Sync account with their existing Google account instead of typing
  # a new email + password — see services/sync_service.dart's
  # signInWithGoogle(). Requires a one-time Firebase console step
  # (enabling Google as a sign-in provider + registering the app's SHA-1
  # fingerprint) that only Jacob can do — see SIGNING_SETUP.md.
  #
  # Deliberately pinned to the 6.x API (not 7.x): v7.0 was a major,
  # actively-discussed breaking rewrite (singleton GoogleSignIn.instance,
  # split authentication/authorization steps, event-driven flow) that's
  # still tripping up experienced Flutter developers in migration guides
  # as of mid-2026. The 6.x API (GoogleSignIn().signIn() ->
  # .authentication -> GoogleAuthProvider.credential(...)) is
  # well-established and exactly what's used below.
  google_sign_in: ^6.2.1

  # local_auth: fingerprint/Face unlock as an alternative to typing the
  # PIN on the Lock Screen — see providers/auth_provider.dart. Requires
  # MainActivity.kt to extend FlutterFragmentActivity and an
  # AppCompat-derived styles.xml theme (both already done) — see those
  # files' own comments for why.
  local_auth: ^2.3.0

  # connectivity_plus: lets us check for an internet connection before
  # attempting a sync, so JavisAudit never hangs or errors out while the
  # owner is offline in the market — sync simply waits for a connection
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # hive_generator and build_runner are used to generate Hive TypeAdapters
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  # Declare any assets (images, fonts) here if added later
  assets:
    - assets/
