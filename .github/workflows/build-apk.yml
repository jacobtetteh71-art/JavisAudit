name: Build JavisAudit APK

# Runs automatically whenever you push to main/master, AND lets you
# trigger it manually from the "Actions" tab in GitHub with a button click.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Pull your repository code into the build machine
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java (required by the Android Gradle build)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Install the Flutter SDK.
      #    Bumped from 3.24.5 -> 3.32.1: 3.24.5 hits a known Flutter
      #    tooling bug (flutter/flutter#164362 / #164369, "[Compile]:
      #    Could not get unknown property 'flutter' for extension
      #    'android'") that breaks the Android build for several
      #    plugins — including flutter_plugin_android_lifecycle,
      #    pulled in transitively by image_picker/share_plus — any
      #    time it's built on Flutter < 3.27. 3.32.1 is comfortably
      #    past that fix, still within this project's Dart SDK
      #    constraint (pubspec.yaml: '>=3.2.0 <4.0.0'), and — unlike
      #    3.44+ — predates Flutter's Material/Cupertino "moved out of
      #    core" change, so it doesn't require any app-side migration.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: 'stable'
          cache: true

      # 4. Sanity-check the environment (shows up in the build log)
      - name: Flutter doctor
        run: flutter doctor -v

      # 5. Download all Dart/Flutter package dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5b. Restore (or start) a STABLE debug keystore, cached across
      #     every run by a fixed key (not tied to this run's ID) —
      #     so it's the exact same key every single build, not a
      #     fresh random one each time. This is what actually fixes
      #     "App not installed as package conflicts with an existing
      #     package": a GitHub Actions runner is a brand-new machine
      #     every run, so without this, Android's default debug
      #     keystore location (~/.android/debug.keystore) would get a
      #     freshly regenerated random key on every build, and Android
      #     refuses to install an "update" signed with a different key
      #     than what's already on the phone. Only matters for builds
      #     WITHOUT a real release keystore configured below — once
      #     you set one up via SIGNING_SETUP.md, that takes over and
      #     this cache becomes irrelevant.
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: stable-debug-keystore-v1

      # 5c. If you've set up a real release keystore (see
      #     SIGNING_SETUP.md), decode it from GitHub Secrets and write
      #     android/key.properties — build.gradle picks this up
      #     automatically and signs with it instead of the debug key.
      #     A no-op (every step below just skips) until those secrets
      #     exist, so this is safe to leave in either way.
      - name: Configure release signing (if secrets are set)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks
          cat > android/key.properties <<EOF
          storeFile=release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # 6. Static analysis pass — won't fail the build, just reports issues in the log
      - name: Analyze project (non-blocking)
        run: flutter analyze || true

      # 7. Build the release APK
      - name: Build release APK
        run: flutter build apk --release

      # 8. Upload the finished APK as a downloadable build artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: javisaudit-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
