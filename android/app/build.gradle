// ============================================================
// android/app/build.gradle  –  Android Build Configuration
// ============================================================
// Defines the package name, minimum Android version, and how
// the app is signed and compiled into an APK.
// ============================================================

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must come after Android & Kotlin
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.3'

// ── Release signing ───────────────────────────────────────────
// SECURITY/STABILITY FIX: every install after the first used to
// fail with "App not installed as package conflicts with an
// existing package." Root cause: the release build was signed with
// `signingConfigs.debug`, and GitHub Actions runners are a brand
// new machine every run — with nothing to persist it, a FRESH,
// randomly-generated debug keystore gets created on every single
// CI run. Android refuses to install an "update" that's signed with
// a different key than whatever's already on the phone, so every
// build conflicted with the last one and forced an uninstall first.
//
// Fixed by reading a real, STABLE keystore from key.properties —
// see SIGNING_SETUP.md for exactly how to generate one and wire it
// into GitHub Actions via secrets (the workflow writes this file
// from those secrets before the build runs; it's never committed to
// the repo — see .gitignore). Falls back to debug signing when
// key.properties doesn't exist (e.g. building locally without it
// set up yet), so `flutter build apk` still works out of the box —
// it just won't be install-stable across rebuilds until you do.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace = "com.javisaudit.app"
    // compileSdk 35 = Android 15. Bumped from 34 -> 35 because
    // flutter_plugin_android_lifecycle (a transitive dependency of
    // several plugins, including image_picker and share_plus) now
    // requires SDK 35+ — building against 34 produced a "requires
    // Android SDK version 35 or higher" warning in CI. minSdk (below)
    // is unaffected: this only changes what SDK the app is COMPILED
    // against, not the oldest Android version it can RUN on.
    compileSdk = 35
    // Pinned explicitly (rather than left at the Flutter default)
    // because every plugin in this project — cloud_firestore,
    // firebase_auth/core, connectivity_plus, file_picker,
    // flutter_local_notifications, image_picker, path_provider,
    // printing, share_plus, sqflite — declares this as the NDK
    // version it needs. Flutter's default lagged behind that,
    // producing a build-time warning (harmless on its own, but
    // worth silencing per the exact fix Flutter's own tooling
    // suggests: NDKs are backward compatible, so pinning to the
    // highest version any plugin asks for satisfies all of them).
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // Required by flutter_local_notifications, which uses Java 8+
        // time/stream APIs internally — this "desugars" them so they
        // still work on older Android versions (down to minSdk 26).
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Unique app identifier — used on the Play Store and for
        // the private SQLite database directory:
        // /data/data/com.javisaudit.app/databases/javisaudit.db
        applicationId = "com.javisaudit.app"

        // minSdk 26 = Android 8.0 — matches the document spec
        // recommendation (API Level 26+) for broad device coverage
        // among Ghanaian MSE owners while keeping modern APIs available.
        minSdk = 26
        targetSdk = 34

        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Real keystore when key.properties is present (stable
            // across every build — see SIGNING_SETUP.md); otherwise
            // falls back to debug signing so a from-scratch checkout
            // still builds, with the caveat noted above.
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            // REQUIRED by sqflite_sqlcipher (see proguard-rules.pro
            // for why) now that minifyEnabled is on and the database
            // is encrypted — without this, SQLCipher's native-bridge
            // classes get stripped and the release APK crashes the
            // first time it opens the database, even though debug
            // builds (no shrinking) work fine.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Kotlin standard library, required by the Flutter Android embedding
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.0"

    // Provides the actual Java 8+ API implementations enabled above
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

// ── Cloud Sync (Firebase) — applied conditionally ────────────
// The google-services plugin needs a REAL google-services.json
// (downloaded from your own Firebase project — see SYNC_SETUP.md)
// to work at all; feeding it a fake/placeholder file makes it
// crash during Gradle's project setup with confusing, unrelated-
// looking errors ("compileSdkVersion is not specified" etc.).
// So: no file here yet → skip it entirely, and the app still
// builds and runs fine, just with Cloud Sync inactive (already
// handled gracefully by the try/catch around Firebase.initializeApp()
// in main.dart). Once you add your real google-services.json to
// this folder, this starts applying automatically — no other
// change needed.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}
