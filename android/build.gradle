// ============================================================
// android/build.gradle  –  Project-level Gradle Configuration
// ============================================================
// Declares the repositories and plugin versions shared by
// every module (in our case, just the single "app" module).
// ============================================================

buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Android Gradle Plugin — must stay compatible with the
        // compileSdk/targetSdk 34 declared in app/build.gradle, and
        // with the Gradle version in gradle/wrapper/gradle-wrapper.properties
        // (AGP 8.7.x requires Gradle 8.9+; Flutter 3.27+ requires AGP 8.1.1+
        // and its own Gradle plugin now requires Gradle 8.7+)
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

// FIX for "AAPT: error: resource android:attr/lStar not found":
// This is a confirmed Flutter regression (flutter/flutter#153281) that
// appears when a plugin was compiled against an Android SDK version
// below 31, while the app itself targets a newer one (34, in our case).
// The official workaround from the Flutter team is to bump any such
// plugin's compileSdk up to 31 automatically at build time — this does
// NOT change our own app's SDK settings, only the plugins that need it.
subprojects {
    afterEvaluate { project ->
        if (project.extensions.findByName("android") != null) {
            Integer pluginCompileSdk = project.android.compileSdk
            if (pluginCompileSdk != null && pluginCompileSdk < 31) {
                project.logger.error(
                        "Overriding compileSdk in plugin '" + project.name +
                        "' from " + pluginCompileSdk + " to 31 " +
                        "(workaround for https://github.com/flutter/flutter/issues/153281)"
                )
                project.android {
                    compileSdk 31
                }
            }
        }
    }
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
