// ============================================================
// android/build.gradle  –  Project-level Gradle Configuration
// ============================================================
// Declares the repositories and plugin versions shared by
// every module (in our case, just the single "app" module).
// ============================================================

buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Android Gradle Plugin — must stay compatible with the
        // compileSdk/targetSdk 34 declared in app/build.gradle
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // FIX for "AAPT: error: resource android:attr/lStar not found":
    // Some plugins (transitively) pull in an older androidx.core that
    // doesn't define this attribute for compileSdk 31+, while others
    // pull a newer one — causing a resource clash at build time. This
    // forces every module in the project to use one consistent,
    // up-to-date version, which resolves the conflict.
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
