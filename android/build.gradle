// ============================================================
// android/build.gradle  –  Project-level Gradle Configuration
// ============================================================
// Declares the repositories and plugin versions shared by
// every module (in our case, just the single "app" module).
// ============================================================

buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Android Gradle Plugin — must stay compatible with the
        // compileSdk/targetSdk 34 declared in app/build.gradle
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
